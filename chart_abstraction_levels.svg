<svg viewBox="0 0 1040 480" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: Georgia, 'Times New Roman', serif; }
    .ax { font-size: 10px; fill: #6b6459; }
    .band-label { font-size: 10.5px; font-style: italic; }
    .annot { font-size: 9.5px; font-style: italic; }
  </style>

  <rect width="1040" height="480" fill="#f7f4ee"/>

  <!-- Title -->
  <text x="520" y="28" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Error abstraction level over time</text>
  <text x="520" y="44" font-size="10.5" fill="#6b6459" text-anchor="middle" font-style="italic">Each point is one distinct error. Vertical axis: syntactic (wrong API/value), structural (cross-component), semantic (reasoning about spec/governance).</text>

  <!-- Band backgrounds -->
  <rect x="72" y="60" width="952" height="100" fill="#ede0f5" opacity="0.4"/>
  <rect x="72" y="160" width="952" height="100" fill="#d8e4f0" opacity="0.4"/>
  <rect x="72" y="260" width="952" height="100" fill="#f5e8c8" opacity="0.4"/>

  <!-- Band labels -->
  <text x="1022" y="112" class="band-label" fill="#5a3080" text-anchor="end">semantic</text>
  <text x="1022" y="212" class="band-label" fill="#2a4870" text-anchor="end">structural</text>
  <text x="1022" y="312" class="band-label" fill="#7a5a20" text-anchor="end">syntactic</text>

  <!-- Y axis -->
  <line x1="72" y1="60" x2="72" y2="370" stroke="#c8c0b4" stroke-width="1"/>
  <text x="64" y="112" class="ax" text-anchor="end">3</text>
  <text x="64" y="212" class="ax" text-anchor="end">2</text>
  <text x="64" y="312" class="ax" text-anchor="end">1</text>
  <text x="28" y="215" class="ax" text-anchor="middle" transform="rotate(-90,28,215)">Abstraction level</text>

  <!-- X axis -->
  <line x1="72" y1="370" x2="1024" y2="370" stroke="#c8c0b4" stroke-width="1"/>
  <text x="87"  y="386" class="ax" text-anchor="middle">1</text>
  <text x="207" y="386" class="ax" text-anchor="middle">5</text>
  <text x="357" y="386" class="ax" text-anchor="middle">10</text>
  <text x="507" y="386" class="ax" text-anchor="middle">15</text>
  <text x="657" y="386" class="ax" text-anchor="middle">20</text>
  <text x="807" y="386" class="ax" text-anchor="middle">25</text>
  <text x="867" y="386" class="ax" text-anchor="middle">27</text>
  <text x="987" y="386" class="ax" text-anchor="middle">31</text>
  <text x="520" y="402" class="ax" text-anchor="middle">Error number (chronological)</text>

  <!-- Phase 1 marker: between 17 and 18, x = 87 + 17*30 = 597 -->
  <line x1="567" y1="60" x2="567" y2="370" stroke="#8a6030" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.65"/>
  <rect x="462" y="48" width="210" height="17" rx="3" fill="#f5ecd8" stroke="#8a6030" stroke-width="0.7" opacity="0.95"/>
  <text x="567" y="60" class="annot" fill="#6a4820" text-anchor="middle">1st refactor — failure surface moves upstream</text>

  <!-- Phase 2 marker: between 27 and 28, x = 87 + 27*30 = 897 -->
  <line x1="897" y1="60" x2="897" y2="370" stroke="#3a5a8a" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.65"/>
  <rect x="790" y="48" width="214" height="17" rx="3" fill="#d8eaf5" stroke="#3a5a8a" stroke-width="0.7" opacity="0.95"/>
  <text x="897" y="60" class="annot" fill="#1a3a60" text-anchor="middle">2nd refactor — model behavior layer added</text>

  <!-- Points: x = 87 + (i-1)*30, y: L1=312, L2=212, L3=112
       1:L1 2:L2 3:L2 4:L2 5:L2 6:L2 7:L2 8:L2 9:L2 10:L3
       11:L1 12:L2 13:L1 14:L1 15:L1 16:L1 17:L1 18:L3 19:L3
       20:L3 21:L3 22:L3 23:L3 24:L3 25:L3 26:L2 27:L2
       28:L3 29:L2 30:L2 31:L1
  -->
  <circle cx="87"  cy="312" r="5.5" fill="#c9a950" stroke="#7a5a20" stroke-width="0.8"/>
  <circle cx="117" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="147" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="177" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="207" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="237" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="267" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="297" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="327" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="357" cy="112" r="5.5" fill="#9470bb" stroke="#42286a" stroke-width="0.8"/>
  <circle cx="387" cy="312" r="5.5" fill="#c9a950" stroke="#7a5a20" stroke-width="0.8"/>
  <circle cx="417" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="447" cy="312" r="5.5" fill="#c9a950" stroke="#7a5a20" stroke-width="0.8"/>
  <circle cx="477" cy="312" r="5.5" fill="#c9a950" stroke="#7a5a20" stroke-width="0.8"/>
  <circle cx="507" cy="312" r="5.5" fill="#c9a950" stroke="#7a5a20" stroke-width="0.8"/>
  <circle cx="537" cy="312" r="5.5" fill="#c9a950" stroke="#7a5a20" stroke-width="0.8"/>
  <circle cx="567" cy="312" r="5.5" fill="#c9a950" stroke="#7a5a20" stroke-width="0.8"/>
  <circle cx="597" cy="112" r="5.5" fill="#9470bb" stroke="#42286a" stroke-width="0.8"/>
  <circle cx="627" cy="112" r="5.5" fill="#9470bb" stroke="#42286a" stroke-width="0.8"/>
  <circle cx="657" cy="112" r="5.5" fill="#9470bb" stroke="#42286a" stroke-width="0.8"/>
  <circle cx="687" cy="112" r="5.5" fill="#9470bb" stroke="#42286a" stroke-width="0.8"/>
  <!-- Error 22 emphasized -->
  <circle cx="717" cy="112" r="8.5" fill="#6a3ea0" stroke="#2a1060" stroke-width="1.2"/>
  <line x1="717" y1="102" x2="717" y2="80" stroke="#6a3ea0" stroke-width="0.7" stroke-dasharray="2,2"/>
  <rect x="626" y="66" width="182" height="17" rx="3" fill="#f0e4f5" stroke="#6a3ea0" stroke-width="0.6"/>
  <text x="717" y="77" font-size="9" fill="#2a1060" text-anchor="middle" font-style="italic">error 22 · affirmative citation</text>
  <circle cx="747" cy="112" r="5.5" fill="#9470bb" stroke="#42286a" stroke-width="0.8"/>
  <circle cx="777" cy="112" r="5.5" fill="#9470bb" stroke="#42286a" stroke-width="0.8"/>
  <circle cx="807" cy="112" r="5.5" fill="#9470bb" stroke="#42286a" stroke-width="0.8"/>
  <circle cx="837" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="867" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <!-- Post 2nd refactor -->
  <circle cx="897" cy="112" r="5.5" fill="#9470bb" stroke="#42286a" stroke-width="0.8"/>
  <circle cx="927" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="957" cy="212" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <circle cx="987" cy="312" r="5.5" fill="#c9a950" stroke="#7a5a20" stroke-width="0.8"/>

  <!-- Legend -->
  <circle cx="290" cy="432" r="5.5" fill="#9470bb" stroke="#42286a" stroke-width="0.8"/>
  <text x="300" y="436" font-size="11" fill="#4a4a4a">Semantic</text>
  <circle cx="390" cy="432" r="5.5" fill="#6a92c4" stroke="#2a4870" stroke-width="0.8"/>
  <text x="400" y="436" font-size="11" fill="#4a4a4a">Structural</text>
  <circle cx="490" cy="432" r="5.5" fill="#c9a950" stroke="#7a5a20" stroke-width="0.8"/>
  <text x="500" y="436" font-size="11" fill="#4a4a4a">Syntactic</text>

  <!-- Footer note -->
  <text x="72" y="458" font-size="10" fill="#6b6459" font-style="italic">Errors 1–17: Dask/Python implementation errors fixable by editing code. Errors 18–27: failure surface migrated to task specifications. Errors 28–31: post-second-refactor.</text>
</svg>
